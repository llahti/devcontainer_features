name: Test features

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:          # reused by release.yaml
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # weekly: the installer is downloaded from the internet, so upstream changes can break us

permissions:
  contents: read

jobs:
  base-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - mcr.microsoft.com/devcontainers/base:ubuntu
          - mcr.microsoft.com/devcontainers/base:debian
    steps:
      - uses: actions/checkout@v4
      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli
      - name: Default test on ${{ matrix.image }}
        run: devcontainer features test -f claude-code -i ${{ matrix.image }} .

  scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli
      - name: Scenario tests
        run: devcontainer features test -f claude-code --skip-autogenerated .
